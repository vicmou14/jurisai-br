services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: jurisai
      POSTGRES_USER: jurisai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jurisai}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jurisai -d jurisai"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://jurisai:${POSTGRES_PASSWORD:-jurisai}@db:5432/jurisai
      JURISAI_API_KEY: ${JURISAI_API_KEY:-}
      JURISAI_ENV: ${JURISAI_ENV:-development}
      JURISAI_CORS_ORIGINS: ${JURISAI_CORS_ORIGINS:-http://localhost:8000}
      JURISAI_TEXT_PROVIDER: ${JURISAI_TEXT_PROVIDER:-ollama}
      JURISAI_OLLAMA_URL: ${JURISAI_OLLAMA_URL:-http://host.docker.internal:11434}
      JURISAI_OLLAMA_MODEL: ${JURISAI_OLLAMA_MODEL:-qwen3:8b}
      JURISAI_TEXT_TIMEOUT: ${JURISAI_TEXT_TIMEOUT:-300}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JURISAI_OPENAI_MODEL: ${JURISAI_OPENAI_MODEL:-gpt-5.6-sol}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  postgres_data:
