<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JurisAI-BR — Acesso</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="container"><section class="card"><h1>JurisAI-BR</h1><p>Configure o acesso à API neste navegador.</p><form id="login"><input id="key" type="password" placeholder="API key" required><button>Entrar</button></form></section></main><script>document.querySelector('#login').addEventListener('submit',e=>{e.preventDefault();sessionStorage.setItem('jurisai_api_key',document.querySelector('#key').value);location.href='index.html'})</script></body></html>
