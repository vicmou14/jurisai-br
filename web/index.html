<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>JurisAI-BR</title><link rel="stylesheet" href="styles.css"></head><body><main class="container"><header><div><h1>JurisAI-BR</h1><p>Pesquisa jurídica com rastreabilidade de fontes.</p></div><a href="login.html">Credenciais</a></header><section class="card"><h2>Pesquisa jurídica</h2><form id="search-form"><input id="query" required minlength="3" placeholder="Ex.: produto defeituoso e direito do consumidor"><button>Pesquisar</button></form><div id="status" role="status"></div><div id="results"></div></section><section class="card"><h2>Adicionar documento</h2><form id="document-form"><input id="title" required placeholder="Título"><input id="source" required placeholder="Fonte"><input id="category" placeholder="Categoria" value="geral"><textarea id="content" required placeholder="Cole o conteúdo jurídico"></textarea><button>Salvar conteúdo</button></form><hr><form id="upload-form"><label>Ou envie PDF, DOCX ou TXT<input id="file" type="file" accept=".pdf,.docx,.txt" required></label><input id="upload-title" placeholder="Título opcional"><input id="upload-source" placeholder="Fonte opcional"><button>Enviar arquivo</button></form></section><section class="card"><h2>Fontes oficiais</h2><div id="sources">Carregando fontes...</div></section></main><script src="app.js"></script></body></html>
